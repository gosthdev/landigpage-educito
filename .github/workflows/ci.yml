name: CI — Pull Request Check

on:
  pull_request:
    branches:
      - develop
      - qa
      - prod

permissions:
  contents: read

jobs:
  validate:
    name: Validate landing page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Build 
        run: pnpm build

