name: CD — Deploy to Production

on:
  push:
    branches:
      - develop
      - qa
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write  
  contents: read

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            echo "environment=qa" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy landing 
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SSM_PREFIX: ${{ vars.SSM_PREFIX }}

    steps:
      - name: Checkout 
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read config from SSM Parameter Store
        id: ssm
        run: |
          REDIRECT_URL=$(aws ssm get-parameter \
            --name "${{ env.SSM_PREFIX }}/NEXT_PUBLIC_REDIRECT_URL" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          S3_BUCKET=$(aws ssm get-parameter \
            --name "${{ env.SSM_PREFIX }}/LANDING_BUCKET_NAME" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          CF_DISTRIBUTION_ID=$(aws ssm get-parameter \
            --name "${{ env.SSM_PREFIX }}/LANDING_DISTRIBUTION_ID" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          echo "redirect_url=$REDIRECT_URL" >> $GITHUB_OUTPUT
          echo "s3_bucket=$S3_BUCKET" >> $GITHUB_OUTPUT
          echo "cf_distribution_id=$CF_DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Build project
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_REDIRECT_URL: ${{ steps.ssm.outputs.redirect_url }}

      - name: Sync to S3
        run: |
          aws s3 sync out/ s3://${{ steps.ssm.outputs.s3_bucket }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

          aws s3 sync out/ s3://${{ steps.ssm.outputs.s3_bucket }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.ssm.outputs.cf_distribution_id }} \
            --paths "/*"
